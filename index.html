<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarePulse - Worker Accounts</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="brand">
        <i data-feather="heart"></i>
        <h2>CarePulse</h2>
      </div>
      <nav class="nav-menu">
        <a href="#" class="nav-item active"><i data-feather="users"></i> Worker Accounts</a>
        <a href="#" onclick="logoutUser()" class="nav-item" style="margin-top: auto; color: #ee5d50;"><i data-feather="log-out"></i> Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1 id="page-title">Worker Accounts</h1>
        <div class="user-profile">
          <div class="avatar" id="user-avatar">AD</div>
          <span id="user-name">Admin</span>
        </div>
      </header>

      <section class="content-section">
        <div class="table-container">
          <h2>Manage Worker Accounts</h2>
          <p>Create and manage staff accounts. Patient accounts and records are not available here.</p>
          <button class="btn-primary" onclick="showAddUserModal()">+ Add Worker Account</button>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-table">
              <tr><td colspan="4" style="text-align: center;">Loading worker accounts...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="admin-dashboard.js"></script>
  <script>feather.replace();</script>
</body>
</html>
