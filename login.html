<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarePulse - Login</title>
  <link rel="stylesheet" href="login.css">
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <i data-feather="heart"></i>
        <h2>CarePulse</h2>
      </div>
      <p class="subtitle">Sign in to your CarePulse account</p>

      <form id="login-form" action="login.php" method="POST">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@carepulse.com" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="submit-btn">Login</button>
      </form>
      <p class="register-link">
        New patient? <a href="register.html">Register here</a>
      </p>
    </div>
  </div>

  <script src="login.js"></script>
  <script>feather.replace();</script>
</body>
</html>
